# ─── PROFILE TEMPLATE (safe to commit — contains NO personal data) ─────────
#
# Your REAL profile with personal info lives in config/profile.local.yaml,
# which is gitignored. To set up:
#
#   cp config/profile.yaml config/profile.local.yaml
#   # then edit profile.local.yaml with your real experience/skills
#
# The loader prefers profile.local.yaml when it exists and falls back to this
# template otherwise. Same pattern works for answers.local.yaml / settings.local.yaml.

# ─── Personal Information ───────────────────────────────────────
personal:
  first_name: "Jane"
  last_name: "Doe"
  title: "Software Engineer"
  email: "jane.doe@example.com"
  phone: "+1 555-123-4567"
  phone_country_code: "United States (+1)"
  linkedin_url: "https://www.linkedin.com/in/janedoe"
  website: "https://github.com/janedoe"
  github: "https://github.com/janedoe"
  street_address: ""               # e.g. "123 Main St" — fills "Street Address" fields
  city: "Seattle"
  state: "Washington"
  country: "United States"
  location: "Seattle, WA"          # used for the resume header / "city, state" fields
  zip: ""
  willing_to_relocate: true

# ─── Professional Summary (lightly keyword-aligned per job) ─────
summary: >
  Software engineer with 5+ years building production systems and data
  pipelines in Python and SQL. Replace this with your own summary — it is
  keyword-aligned to each job description but never fabricated.

# ─── Work Experience ───────────────────────────────────────────
# Each bullet's `skills` tags drive the per-role "Technologies" line and the
# JD keyword matching. Bullet TEXT is always used verbatim (never rewritten).
experience:
  - company: "Acme Corp"
    title: "Senior Software Engineer"
    start_date: "2022-03"
    end_date: "present"
    location: "Seattle, WA"
    bullets:
      - text: "Describe a real accomplishment with a concrete, measurable impact."
        skills: ["python", "sql", "data pipelines"]
      - text: "Another accomplishment; keep numbers/impact truthful."
        skills: ["machine learning", "aws"]

  - company: "StartupXYZ"
    title: "Software Engineer"
    start_date: "2019-01"
    end_date: "2022-02"
    location: "Remote"
    bullets:
      - text: "Shipped a customer-facing feature used by N users."
        skills: ["python", "rest api", "postgresql"]

# ─── Education ─────────────────────────────────────────────────
education:
  - institution: "State University"
    degree: "Bachelor of Science"
    field: "Computer Science"
    graduation_date: "2018-05"
    gpa: "3.8"
    honors: ""

# ─── Skills ────────────────────────────────────────────────────
skills:
  Languages: ["Python", "SQL", "JavaScript"]
  ML/AI: ["Machine Learning", "NLP", "LLMs"]
  Data: ["Spark", "Data Pipelines"]
  Platforms: ["AWS", "Docker", "Git"]

# ─── Certifications ────────────────────────────────────────────
certifications:
  - name: "AWS Solutions Architect Associate"
    date: ""

# ─── Publications (optional) ───────────────────────────────────
publications: []

# ─── Personal Projects (name, detail, url, tech) ───────────────
projects:
  - name: "Example Project"
    detail: "One-line description of what it does / a result."
    url: "https://github.com/janedoe/example"
    tech: ["python", "machine learning"]

# ─── Awards (optional) ─────────────────────────────────────────
awards: []

# ─── Years of experience per technology (for numeric form fields) ─
# Longest key wins ("machine learning" beats "ml"); add aliases employers use.
# Unknown techs fall through to the LLM (which sees this table), not `default`.
technology_experience:
  python: 5
  sql: 5
  javascript: 3
  machine learning: 3
  ml: 3
  ai: 3
  llm: 2
  nlp: 2
  aws: 3
  docker: 3
  git: 6
  default: 2
