# ─── Bot Behavior ───────────────────────────────────────────────
bot:
  # Dry-run mode: fill forms but do NOT submit. Use for calibration.
  dry_run: true
  # Max applications per session. Kept low for a small daily cadence
  # (scheduled at 9am PST) and to stay well under detection thresholds.
  max_applications: 5
  # Seconds to wait between applications (random within range)
  delay_min: 5
  delay_max: 18
  # Seconds to wait between form field interactions
  field_delay_min: 1
  field_delay_max: 4
  # Capture a screenshot at each form step (for human review)
  capture_screenshots: true
  screenshots_dir: "screenshots"
  # Easy Apply form walking: how many steps before giving up, and how many
  # times to retry a step that isn't advancing (red validation error) before
  # recording the error and moving on to the next job.
  max_form_steps: 20
  max_stuck_retries: 4

# ─── Beyond Easy Apply (external company ATS) ─────────────────
# When a job is NOT LinkedIn Easy Apply, follow the "Apply" button to the
# company's own site (Workday / Greenhouse / Lever / Ashby / ...) and navigate
# it dynamically with the LLM, filling fields + uploading your resume.
#
# IMPORTANT: to actually ENCOUNTER external jobs you must also set
# `search.easy_apply_only: false` below — otherwise the search only returns
# Easy Apply postings. Many external ATS require creating an account, which the
# bot cannot do; those are recorded as needs_review for you to finish by hand.
external_apply:
  enabled: true
  # false = fill the external form but stop BEFORE the final submit (safer;
  #         you review and click submit). true = attempt to submit.
  submit: false
  # Max pages to walk on an external application before giving up
  max_pages: 8

# ─── Job Search Filters ────────────────────────────────────────
search:
  # Each keyword is searched SEPARATELY (its own LinkedIn query), then
  # results are merged and de-duplicated. Add/remove target roles here.
  keywords:
    - "Data Scientist"
    - "Software Engineer"
    - "Software Developer"
    - "AI Engineer"
    - "Machine Learning Engineer"
    - "Algorithm Engineer"
    - "Data Engineer"
  locations:
    - "Seattle, Washington, United States"
  # Filter to Easy Apply only. Set false to ALSO surface external-ATS jobs
  # (requires external_apply.enabled: true to actually apply to them).
  easy_apply_only: true
  # Sort newest-first so 24h results surface reliably
  sort_by: "date"
  # How many result pages to walk per keyword (the list is scrolled fully on
  # each page before paginating). Higher = deeper coverage when the first
  # page is mostly jobs we've already applied to.
  max_pages: 5
  # Experience levels: internship, entry_level, associate, mid_senior, director, executive
  # (entry_level = junior, associate = mid-level)
  experience_levels:
    - "entry_level"
    - "associate"
    - "mid_senior"
    - "director"
  # Date posted: any, past_month, past_week, past_24h
  # Set to 24h so the bot only applies to fresh postings.
  date_posted: "past_24h"
  # Remote filter: on_site, remote, hybrid.
  # "Remote or in Seattle" — location above is Seattle, so on_site/hybrid are
  # Seattle-based; remote adds work-from-anywhere roles.
  remote:
    - "on_site"
    - "remote"
    - "hybrid"
  # Job types: full_time, part_time, contract, temporary, internship
  job_types:
    - "full_time"
  # Words in JD that trigger automatic skip (empty = don't skip on JD words)
  blacklist_keywords: []
  # Companies to skip
  blacklist_companies:
    - "Revature"
  # Minimum job match score (0-100) to proceed with application. Scoring is
  # crude keyword-overlap, so real jobs score low (~10-35); keep this low and
  # rely on the ChatGPT experience-fit check (fit: block) as the quality gate.
  min_match_score: 12

# ─── Experience Fit (ChatGPT) ─────────────────────────────────
# Before applying, ChatGPT compares the job's seniority + hard requirements
# against your REAL titles, years, and skills — the honest "am I actually a
# lead?" check. The verdict is recorded on every application and shown on the
# dashboard.
#
# By default nothing is skipped (min_score: 0, skip_recommendations: []) so you
# can review its judgement first. To act on it:
#   min_score: 40                     -> skip anything scoring below 40
#   skip_recommendations: ["skip"]    -> skip roles it deems a clear mismatch
fit:
  enabled: true
  min_score: 0
  skip_recommendations: []

# ─── Salary Filtering ─────────────────────────────────────────
# Filter jobs by extracted salary range. Jobs without salary info
# are included by default (benefit of the doubt).
salary:
  # Minimum annual salary to consider (null = no minimum)
  min_annual: null    # e.g. 100000
  # Maximum annual salary to consider (null = no maximum)
  max_annual: null    # e.g. 250000

# ─── CAPTCHA Handling ─────────────────────────────────────────
# Strategy: "manual" (default), "2captcha", or "capsolver"
captcha:
  strategy: "manual"
  # API key for 2captcha or capsolver (also reads CAPTCHA_API_KEY env var)
  api_key: null
  # Timeout in seconds to wait for CAPTCHA resolution AND for one-time manual
  # login (e.g. "Continue with Google"). Generous so 2FA has time.
  timeout: 600

# ─── Browser Configuration ─────────────────────────────────────
browser:
  # Use real Chrome (not Chromium) for better stealth
  channel: "chrome"
  headless: false
  # Persistent user data directory (reuse sessions / cookies)
  user_data_dir: "browser_data"
  # Viewport (null = use real window size, which is stealthier)
  viewport: null
  # Slow-mo milliseconds added to every action (adds human feel)
  slow_mo: 50
  # Keep the browser/LinkedIn window open after the run finishes (interactive
  # use). The scheduled daily task passes --no-keep-open so it exits cleanly.
  keep_open: true

# ─── LLM Configuration ─────────────────────────────────────────
# Provider: "openai" (ChatGPT, default) or "anthropic".
#
# FREE TOKEN SHARING (ChatGPT): OpenAI grants complimentary daily tokens on
# API traffic you share with them, on eligible models only:
#   • Mini models (gpt-4.1-mini/-nano, gpt-4o-mini, gpt-5-mini/-nano):
#       ~2.5M tokens/day (tiers 1-2), up to 10M/day higher tiers.
#   • Standard models (gpt-4.1, gpt-4o, gpt-5, o-series):
#       ~250K tokens/day (tiers 1-2), up to 1M/day higher tiers.
# To activate: be Usage tier 1+, and enable sharing at
#   https://platform.openai.com/settings/organization/data-controls/sharing
# The models below are all eligible. Field Q&A (the high-volume path) uses a
# mini model to stay inside the generous free bucket; resume tailoring uses a
# standard model for quality but is low-volume (a few calls per job).
llm:
  provider: "openai"
  # Model for high-volume field Q&A + keyword/bullet scoring (mini = big free bucket)
  field_model: "gpt-4.1-mini"
  # Model for resume summary tailoring (standard model, low call volume)
  resume_model: "gpt-4.1"
  # Max tokens for field answers (kept small — answers are short)
  field_max_tokens: 200
  # Max tokens for resume tailoring
  resume_max_tokens: 600

# ─── Resume Configuration ──────────────────────────────────────
resume:
  # mode:
  #   "tailored" — generate a per-job PDF from your profile (default), keyword-
  #                aligned to each JD. Requires an LLM key for best results.
  #   "static"   — always upload YOUR OWN resume file (static_resume_path); no
  #                generation. Use this to bring your own polished resume.
  mode: "tailored"
  # Path to your own resume PDF/DOCX. Used directly in "static" mode, and as the
  # fallback in "tailored" mode if generation fails. Absolute or repo-relative.
  static_resume_path: ""
  # Template to use (filename without extension in src/velvetoverride/resume/templates/)
  template: "default"
  # Target ATS keyword coverage (0.0 - 1.0)
  target_keyword_coverage: 0.70
  # ── Tailoring guardrails ──
  # Bullet text is ALWAYS used verbatim (never rewritten by the LLM). Only the
  # professional summary is keyword-aligned per job. These two settings control
  # how aggressively experience bullets are re-ordered / trimmed:
  #   reorder_bullets: true  → surface the most JD-relevant bullets first
  #   max_bullets_per_job: null → keep every bullet (template shows the top ones)
  # Bullet TEXT is never rewritten — only ordered — so impacts stay truthful.
  reorder_bullets: true
  max_bullets_per_job: null

# ─── Tracking / Database ───────────────────────────────────────
tracking:
  database_path: "data/applications.db"
  # Export format: csv, json, or both
  export_format: "both"
  export_path: "data/"
