[project]
name = "velvetoverride"
version = "0.1.0"
description = "Automated LinkedIn job application bot with AI-powered form filling and resume tailoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "patchright>=1.0.0",
    "anthropic>=0.42.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "structlog>=24.0.0",
    "click>=8.1.0",
    "thefuzz>=0.22.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
latex = [
    "latex>=0.7.0",
]

[project.scripts]
velvetoverride = "velvetoverride.main:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
